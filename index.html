<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rippleloop: Echoes</title>
    <style>
        /* CSS Rippleloop Aesthetic - Ethereal, Dark & Glowing */
        :root {
            --glow-cyan: #00f3ff;
            --glow-purple: #b052ff;
            --glass-bg: rgba(10, 20, 35, 0.6);
            --glass-border: rgba(0, 243, 255, 0.2);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #050914; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            touch-action: none; user-select: none; -webkit-user-select: none;
            color: #fff;
        }
        
        #gameCanvas { display: block; width: 100%; height: 100%; }
        
        /* Glassmorphism HUD */
        #hud { 
            position: absolute; top: 20px; left: 20px; 
            background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 15px 25px; pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #hud h1 { margin: 0; font-size: clamp(18px, 4vw, 24px); font-weight: 300; letter-spacing: 1px; color: var(--glow-cyan); text-shadow: 0 0 10px var(--glow-cyan); }
        #hud p { margin: 8px 0 0 0; font-size: clamp(12px, 3vw, 14px); opacity: 0.8; letter-spacing: 0.5px; }
        
        /* Modern Glass Button */
        #shop-btn { 
            position: absolute; top: 20px; right: 20px; 
            padding: 12px 24px; font-size: 14px; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; background: var(--glass-bg); color: var(--glow-cyan);
            border: 1px solid var(--glass-border); border-radius: 20px; 
            backdrop-filter: blur(10px); transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }
        #shop-btn:active { transform: scale(0.95); box-shadow: 0 0 20px var(--glow-cyan); background: rgba(0, 243, 255, 0.1); }
        
        /* Glass Shop Menu */
        #shop-menu { 
            position: absolute; top: 80px; right: 20px; width: clamp(280px, 85vw, 350px); max-height: 75vh; overflow-y: auto; 
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); padding: 20px; 
            display: none; flex-direction: column; gap: 15px; border-radius: 16px; z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #shop-menu h3 { margin: 0 0 15px 0; text-align: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; font-weight: 300; letter-spacing: 2px; color: #fff; }
        
        .upgrade { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.03); padding: 15px; 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; transition: all 0.2s; 
        }
        .upgrade:active { background: rgba(0, 243, 255, 0.1); border-color: var(--glow-cyan); transform: scale(0.98); }
        .u-name { font-weight: 400; font-size: 15px; display: block; margin-bottom: 4px; color: #eaeaea; }
        .u-cost { color: var(--glow-cyan); font-size: 13px; font-weight: bold; }
        .u-lvl { font-size: 12px; opacity: 0.6; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 10px; }

        .reset-btn { margin-top: 10px; padding: 12px; background: rgba(255, 50, 50, 0.1); color: #ff6b6b; border: 1px solid rgba(255, 50, 50, 0.3); border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="hud">
        <h1>Ecos: <span id="currency-display">0</span></h1>
        <p>Distância: <span id="dist-display">0</span>m | Ondulações: <span id="bounce-display">0</span></p>
    </div>

    <button id="shop-btn">RESSONÂNCIA</button>
    <div id="shop-menu">
        <h3>Melhorias de Fluxo</h3>
        <div class="upgrade" onclick="buyUpgrade('impulse')">
            <div><span class="u-name">Pulso de Éter (Clique no voo)</span><span class="u-cost" id="cost-impulse">Ecos: 10</span></div>
            <span class="u-lvl" id="lvl-impulse">Lvl 0</span>
        </div>
        <div class="upgrade" onclick="buyUpgrade('gravity')">
            <div><span class="u-name">Densidade Lunar (Gravidade)</span><span class="u-cost" id="cost-gravity">Ecos: 50</span></div>
            <span class="u-lvl" id="lvl-gravity">Lvl 0</span>
        </div>
        <div class="upgrade" onclick="buyUpgrade('spirit')">
            <div><span class="u-name">Corrente Espiritual (Passiva)</span><span class="u-cost" id="cost-spirit">Ecos: 200</span></div>
            <span class="u-lvl" id="lvl-spirit">Lvl 0</span>
        </div>
        <button class="reset-btn" onclick="resetSave()">Romper Ciclo (Zerar)</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * ENGINE BASE & SETUP
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let WATER_LEVEL;
let CENTER_X;
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    WATER_LEVEL = canvas.height * 0.70;
    CENTER_X = canvas.width * 0.2; // Origem do lançamento
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Game State
let gameState = { currency: 0, state: 'IDLE', cameraX: 0, pulseRadius: 0, pulseGrowing: true };
let upgrades = {
    impulse: { level: 0, cost: 10, costMult: 1.6 },
    gravity: { level: 0, cost: 50, costMult: 1.8 },
    spirit: { level: 0, cost: 200, costMult: 2.5 }
};

// Física
const baseGravity = 0.18;
const waterFriction = 0.78; 
const bounciness = 0.68; 
const airResistance = 0.996;

/**
 * SISTEMA DE SAVE (localStorage)
 */
function loadData() {
    const saved = localStorage.getItem('rippleloopSave');
    if (saved) {
        const parsed = JSON.parse(saved);
        gameState.currency = parsed.currency || 0;
        if(parsed.upgrades) upgrades = parsed.upgrades;
    }
    updateUI();
}
function saveData() { localStorage.setItem('rippleloopSave', JSON.stringify({ currency: gameState.currency, upgrades })); }
function resetSave() { localStorage.removeItem('rippleloopSave'); location.reload(); }

/**
 * EFEITOS VISUAIS: RIPPLES & PARTICLES
 */
let ripples = [];
let trail = [];

function createRipple(x, y) {
    ripples.push({ x: x, y: y, radius: 2, maxRadius: Math.random() * 40 + 40, alpha: 1 });
}

function updateAndDrawRipples() {
    for (let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        r.radius += 1.5;
        r.alpha -= 0.015;
        
        if (r.alpha <= 0) {
            ripples.splice(i, 1);
            continue;
        }
        
        ctx.beginPath();
        ctx.ellipse(r.x - gameState.cameraX, r.y, r.radius, r.radius * 0.3, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 243, 255, ${r.alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

/**
 * ENTIDADE: O CRISTAL (Pedra)
 */
class Crystal {
    constructor() { this.reset(); }
    
    reset() {
        this.x = CENTER_X;
        this.y = WATER_LEVEL - 60;
        this.vx = 0; this.vy = 0;
        this.bounces = 0; this.distance = 0;
        this.active = false;
        this.spiritActive = false;
        this.spiritTimer = 0;
        trail = [];
    }

    launch(accuracy) {
        this.reset();
        // Accuracy vai de 0 (ruim) a 1 (perfeito). Multiplicamos a força.
        let powerObj = 10 + (accuracy * 20); 
        this.vx = powerObj;
        this.vy = -4 - (accuracy * 5); 
        this.active = true;
    }

    applyImpulse() {
        if (upgrades.impulse.level > 0 && this.y < WATER_LEVEL && !this.spiritActive) {
            this.vy = -3 - (upgrades.impulse.level * 0.3); // Elevação etérea
            this.vx += 1.5 + (upgrades.impulse.level * 0.15); // Aceleração
            // Efeito visual de pulso no ar
            createRipple(this.x, this.y);
        }
    }

    update() {
        if (!this.active) return;

        // Rastro de luz
        if (Math.random() > 0.3) {
            trail.push({x: this.x, y: this.y, alpha: 1, size: Math.random() * 3 + 2});
        }
        if (trail.length > 25) trail.shift();

        let currentGravity = Math.max(0.04, baseGravity - (upgrades.gravity.level * 0.015));

        // Corrente Espiritual (Gaivota do Rippleloop)
        if (this.spiritActive) {
            this.spiritTimer--;
            this.y = WATER_LEVEL - 120 + Math.sin(Date.now() / 150) * 10; // Flutuação suave senoidal
            this.vx = 12; 
            this.vy = 0;
            if (this.spiritTimer <= 0) {
                this.spiritActive = false;
                this.vy = -2; // Pequeno salto ao soltar
            }
        } else {
            this.vy += currentGravity;
            this.vx *= airResistance;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.distance = Math.max(0, this.x - CENTER_X);

        // Colisão com a Água Escura
        if (this.y >= WATER_LEVEL) {
            this.y = WATER_LEVEL;
            
            if (this.vx > 2.2) {
                createRipple(this.x, WATER_LEVEL);
                this.vy = -this.vy * bounciness;
                this.vx *= waterFriction;
                this.bounces++;
                
                // Chance de Invocar o Espírito (Max 50%)
                let spiritChance = Math.min(0.5, upgrades.spirit.level * 0.05);
                if (!this.spiritActive && Math.random() < spiritChance) {
                    this.spiritActive = true;
                    this.spiritTimer = 70; // Tempo voando com o espírito
                    createRipple(this.x, WATER_LEVEL); // Ripple maior na captura
                }
            } else {
                // Cristal afunda e ressoa
                this.active = false;
                createRipple(this.x, WATER_LEVEL);
                calculateRewards(this);
                setTimeout(() => { 
                    gameState.state = 'IDLE'; 
                    gameState.cameraX = 0; 
                    trail = [];
                }, 1800);
            }
        }
    }

    draw() {
        if (!this.active && gameState.state !== 'IDLE' && gameState.state !== 'CHARGING') return;
        
        let screenX = (this.active || gameState.state === 'FLYING') ? this.x - gameState.cameraX : CENTER_X;
        let screenY = this.y;

        // Desenhar Rastro
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < trail.length; i++) {
            let t = trail[i];
            t.alpha -= 0.04;
            if (t.alpha <= 0) continue;
            ctx.beginPath();
            ctx.arc(t.x - gameState.cameraX, t.y, t.size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(0, 243, 255, ${t.alpha})`;
            ctx.fill();
        }

        // Desenhar Cristal
        ctx.beginPath();
        ctx.ellipse(screenX, screenY, 8, 4, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f3ff';
        ctx.fill();
        ctx.shadowBlur = 0; // Resetar para performance
        ctx.globalCompositeOperation = "source-over";

        // Desenhar Espírito carregando (se ativo)
        if (this.spiritActive) {
            ctx.beginPath();
            ctx.moveTo(screenX, screenY - 5);
            ctx.quadraticCurveTo(screenX - 20, screenY - 20, screenX - 30, screenY - 5);
            ctx.quadraticCurveTo(screenX - 10, screenY + 5, screenX, screenY - 5);
            ctx.fillStyle = 'rgba(176, 82, 255, 0.7)';
            ctx.fill();
        }
    }
}

const crystal = new Crystal();

/**
 * SISTEMA DE LANÇAMENTO MEDITATIVO (Anel de Ressonância)
 */
function updateChargeAura() {
    if (gameState.state !== 'CHARGING') return;
    
    let speed = 1.5;
    if (gameState.pulseGrowing) {
        gameState.pulseRadius += speed;
        if (gameState.pulseRadius > 50) gameState.pulseGrowing = false;
    } else {
        gameState.pulseRadius -= speed;
        if (gameState.pulseRadius < 10) gameState.pulseGrowing = true;
    }

    // Desenha o alvo ideal (anel fixo)
    ctx.beginPath();
    ctx.arc(CENTER_X, crystal.y, 40, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Desenha o pulso dinâmico
    ctx.beginPath();
    ctx.arc(CENTER_X, crystal.y, gameState.pulseRadius, 0, Math.PI * 2);
    
    // Cor muda baseada na precisão (40 é o alvo ideal)
    let diff = Math.abs(40 - gameState.pulseRadius);
    if(diff < 5) {
        ctx.strokeStyle = '#00f3ff'; // Perfeito = Ciano
        ctx.shadowBlur = 10; ctx.shadowColor = '#00f3ff';
    } else {
        ctx.strokeStyle = `rgba(176, 82, 255, ${1 - (diff/40)})`; // Roxo fading
    }
    
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.shadowBlur = 0;
}

/**
 * LÓGICA DE RECOMPENSAS E UI
 */
function calculateRewards(cData) {
    let lotusPassed = Math.floor(cData.distance / 1200);
    let resonanceMultiplier = 1 + (lotusPassed * 0.8);
    let earned = Math.floor((cData.distance / 15) * (1 + cData.bounces * 0.15) * resonanceMultiplier);
    
    gameState.currency += earned;
    saveData();
    updateUI();
}

function buyUpgrade(type) {
    let upg = upgrades[type];
    if (gameState.currency >= Math.floor(upg.cost)) {
        gameState.currency -= Math.floor(upg.cost);
        upg.level++;
        upg.cost *= upg.costMult;
        saveData();
        updateUI();
    }
}

function updateUI() {
    document.getElementById('currency-display').innerText = gameState.currency.toLocaleString();
    document.getElementById('dist-display').innerText = Math.floor(crystal.distance);
    document.getElementById('bounce-display').innerText = crystal.bounces;

    for (let key in upgrades) {
        let elCost = document.getElementById(`cost-${key}`);
        let elLvl = document.getElementById(`lvl-${key}`);
        if (elCost && elLvl) {
            elCost.innerText = `Ecos: ${Math.floor(upgrades[key].cost).toLocaleString()}`;
            elLvl.innerText = `Lvl ${upgrades[key].level}`;
        }
    }
}

// Interação da Loja
document.getElementById('shop-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const shop = document.getElementById('shop-menu');
    shop.style.display = shop.style.display === 'flex' ? 'none' : 'flex';
});

/**
 * CONTROLES (Pointer Events para Mobile & Mouse)
 */
window.addEventListener('pointerdown', (e) => {
    if (e.target.id === 'shop-btn' || e.target.closest('#shop-menu')) return;

    if (gameState.state === 'IDLE') {
        gameState.state = 'CHARGING';
        gameState.pulseRadius = 10;
        gameState.pulseGrowing = true;
        crystal.reset();
    } else if (gameState.state === 'FLYING') {
        crystal.applyImpulse();
    }
});

window.addEventListener('pointerup', (e) => {
    if (gameState.state === 'CHARGING') {
        // Cálculo de precisão. O raio perfeito é 40.
        let diff = Math.abs(40 - gameState.pulseRadius);
        // Precisão de 0 a 1.
        let accuracy = Math.max(0, 1 - (diff / 30)); 
        
        crystal.launch(accuracy);
        gameState.state = 'FLYING';
        document.getElementById('shop-menu').style.display = 'none'; // Auto-close menu
    }
});

/**
 * RENDERIZAÇÃO AMBIENTAL (Cenário)
 */
function drawEnvironment() {
    // Gradiente do Céu Noturno
    let skyGrad = ctx.createLinearGradient(0, 0, 0, WATER_LEVEL);
    skyGrad.addColorStop(0, '#030612'); // Topo muito escuro
    skyGrad.addColorStop(1, '#0a1a2f'); // Horizonte profundo
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, WATER_LEVEL);

    // Linha do Horizonte Brilhante (Água)
    ctx.beginPath();
    ctx.moveTo(0, WATER_LEVEL);
    ctx.lineTo(canvas.width, WATER_LEVEL);
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Gradiente da Água
    let waterGrad = ctx.createLinearGradient(0, WATER_LEVEL, 0, canvas.height);
    waterGrad.addColorStop(0, '#041524'); 
    waterGrad.addColorStop(1, '#020a12');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, WATER_LEVEL, canvas.width, canvas.height - WATER_LEVEL);

    // Renderização dos Lótus (Milestones) a cada 1200m
    let maxLotus = Math.max(5, Math.floor((crystal.x + canvas.width) / 1200) + 2);
    for (let i = 1; i <= maxLotus; i++) {
        let lotusX = (i * 1200) - gameState.cameraX;
        if (lotusX > -100 && lotusX < canvas.width + 100) {
            // Reflexo na água
            ctx.fillStyle = 'rgba(176, 82, 255, 0.2)';
            ctx.beginPath();
            ctx.ellipse(lotusX, WATER_LEVEL + 5, 20, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Flor de Lótus Minimalista
            ctx.fillStyle = 'rgba(176, 82, 255, 0.8)';
            ctx.beginPath();
            ctx.moveTo(lotusX, WATER_LEVEL - 15);
            ctx.quadraticCurveTo(lotusX - 15, WATER_LEVEL, lotusX, WATER_LEVEL);
            ctx.quadraticCurveTo(lotusX + 15, WATER_LEVEL, lotusX, WATER_LEVEL - 15);
            ctx.fill();
            
            // Texto do Multiplicador flutuando
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = "11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`x${(1 + (i*0.8)).toFixed(1)}`, lotusX, WATER_LEVEL - 25);
            ctx.textAlign = "left"; // reset
        }
    }
}

/**
 * LOOP PRINCIPAL
 */
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawEnvironment();
    updateAndDrawRipples();

    if (gameState.state === 'FLYING') {
        crystal.update();
        // Câmera segue o cristal, mantendo-o a 20% da tela à esquerda
        if (crystal.x > CENTER_X) {
            // Interpolação suave de câmera (Lerp)
            gameState.cameraX += ((crystal.x - CENTER_X) - gameState.cameraX) * 0.1;
        }
        updateUI();
    }

    updateChargeAura();
    crystal.draw();

    requestAnimationFrame(gameLoop);
}

// Inicialização
loadData();
gameLoop();
</script>
</body>
</html>
