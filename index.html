<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skip & Skim: The Golden Hour</title>
    <style>
        /* UI de Vidro Fosco (Glassmorphism) - Estilo Fotográfico/Natureza */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-color: #f0f0f0;
            --accent: #ffb347; /* Cor do pôr do sol */
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* Container do WebGL */
        #glcanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Interface Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); color: var(--text-color);
        }

        #hud { position: absolute; top: 20px; left: 20px; padding: 15px 25px; }
        #hud h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); font-weight: 300; text-transform: uppercase; letter-spacing: 2px; }
        #hud h1 span { color: var(--accent); font-weight: 600; text-shadow: 0 0 10px rgba(255, 179, 71, 0.5); }
        #hud p { margin: 8px 0 0 0; font-size: 14px; opacity: 0.9; letter-spacing: 1px; }

        #shop-btn {
            position: absolute; top: 20px; right: 20px; pointer-events: auto;
            padding: 12px 24px; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease; color: #fff;
        }
        #shop-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }

        #shop-menu {
            position: absolute; top: 80px; right: 20px; width: clamp(280px, 85vw, 340px);
            padding: 25px; display: none; flex-direction: column; gap: 15px; pointer-events: auto;
        }
        #shop-menu h3 { margin: 0 0 10px 0; text-align: center; font-weight: 300; letter-spacing: 3px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }

        .upgrade {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent;
        }
        .upgrade:hover { background: rgba(0,0,0,0.4); border-color: var(--accent); }
        .u-name { font-weight: 500; font-size: 14px; display: block; margin-bottom: 4px; }
        .u-cost { color: var(--accent); font-size: 12px; font-weight: bold; }
        .u-lvl { font-size: 12px; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; }

        /* Anel de Arremesso (Medidor) */
        #aim-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            display: none; justify-content: center; align-items: center; pointer-events: none;
        }
        #aim-pulse {
            width: 10px; height: 10px; background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 20px var(--accent);
        }
        
        #loading {
            position: absolute; top:0; left:0; width:100%; height:100%; background:#111; color:#fff;
            display:flex; justify-content:center; align-items:center; z-index: 100; flex-direction: column;
            font-family: monospace; letter-spacing: 2px;
        }
    </style>
    
    <!-- Import Maps para carregar o ecossistema Three.js nativamente sem bundlers -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading">
        <h2 style="font-weight: 300;">RENDERIZANDO O MUNDO...</h2>
        <p style="opacity: 0.5;">Construindo Shaders & Física</p>
    </div>

    <!-- Canvas WebGL -->
    <div id="glcanvas"></div>

    <!-- Camada de Interface -->
    <div id="ui-layer">
        <div id="hud" class="glass-panel">
            <h1>Âmbar: <span id="currency-display">0</span></h1>
            <p>Distância: <span id="dist-display">0</span>m | Saltos: <span id="bounce-display">0</span></p>
        </div>

        <button id="shop-btn" class="glass-panel">HABILIDADES</button>
        <div id="shop-menu" class="glass-panel">
            <h3>APRIMORAMENTOS</h3>
            <div class="upgrade" onclick="buyUpgrade('impulse')">
                <div><span class="u-name">Impulso Cinético (Clique no Ar)</span><span class="u-cost" id="cost-impulse">Âmbar: 10</span></div>
                <span class="u-lvl" id="lvl-impulse">Lvl 0</span>
            </div>
            <div class="upgrade" onclick="buyUpgrade('aerodynamics')">
                <div><span class="u-name">Aerodinâmica (Menos Arrasto)</span><span class="u-cost" id="cost-aerodynamics">Âmbar: 50</span></div>
                <span class="u-lvl" id="lvl-aerodynamics">Lvl 0</span>
            </div>
            <div class="upgrade" onclick="buyUpgrade('wind')">
                <div><span class="u-name">Corrente de Vento (Passiva)</span><span class="u-cost" id="cost-wind">Âmbar: 200</span></div>
                <span class="u-lvl" id="lvl-wind">Lvl 0</span>
            </div>
        </div>

        <div id="aim-ring">
            <div id="aim-pulse"></div>
        </div>
    </div>

<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';

/**
 * 1. CONFIGURAÇÃO DA ENGINE GRÁFICA & AMBIENTE (The Art Engineering)
 */
const container = document.getElementById('glcanvas');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; // Realismo cinematográfico
renderer.toneMappingExposure = 0.5;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
camera.position.set(0, 30, -50); // Câmera atrás do local de lançamento

const sun = new THREE.Vector3();

// --- SHADER DE ÁGUA REALISTA ---
const waterGeometry = new THREE.PlaneGeometry(10000, 10000);
// Usamos uma textura normal de água hospedada no repositório oficial da Three.js
const waterNormals = new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/waternormals.jpg', function(texture) {
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
});

const water = new Water(waterGeometry, {
    textureWidth: 512, textureHeight: 512,
    waterNormals: waterNormals,
    sunDirection: new THREE.Vector3(),
    sunColor: 0xffffff,
    waterColor: 0x001e0f, // Cor profunda do lago
    distortionScale: 3.7,
    fog: scene.fog !== undefined
});
water.rotation.x = -Math.PI / 2;
scene.add(water);

// --- SHADER DO CÉU (SKYBOX VOLUMÉTRICA) ---
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value = 10;
skyUniforms['rayleigh'].value = 2;
skyUniforms['mieCoefficient'].value = 0.005;
skyUniforms['mieDirectionalG'].value = 0.8;

// Parâmetros do Pôr do Sol
const elevation = 2; // Sol baixo
const azimuth = 180;
const phi = THREE.MathUtils.degToRad(90 - elevation);
const theta = THREE.MathUtils.degToRad(azimuth);
sun.setFromSphericalCoords(1, phi, theta);

sky.material.uniforms['sunPosition'].value.copy(sun);
water.material.uniforms['sunDirection'].value.copy(sun).normalize();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(sky).texture;

/**
 * 2. GERAÇÃO PROCEDURAL DE TEXTURA DA PEDRA (Para realismo sem arquivos extras)
 */
function createRockTexture() {
    const cvs = document.createElement('canvas');
    cvs.width = 256; cvs.height = 256;
    const ctx = cvs.getContext('2d');
    
    // Ruído básico para parecer uma rocha polida de rio
    for (let x = 0; x < 256; x++) {
        for (let y = 0; y < 256; y++) {
            let val = Math.floor(Math.random() * 50) + 50; // Tons escuros/acinzentados
            ctx.fillStyle = `rgb(${val}, ${val}, ${val})`;
            ctx.fillRect(x, y, 1, 1);
        }
    }
    const texture = new THREE.CanvasTexture(cvs);
    return texture;
}

// Geometria da Pedra (Ligeiramente deformada para não ser uma esfera perfeita)
const rockGeo = new THREE.IcosahedronGeometry(2, 2);
const pos = rockGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
    pos.setY(i, pos.getY(i) * 0.5); // Achatando a pedra para ficar no formato de "skimming stone"
}
rockGeo.computeVertexNormals();

const rockMat = new THREE.MeshStandardMaterial({ 
    map: createRockTexture(), 
    roughness: 0.6, metalness: 0.1, color: 0x555555 
});
const stoneMesh = new THREE.Mesh(rockGeo, rockMat);
scene.add(stoneMesh);

/**
 * 3. SISTEMA DE PARTÍCULAS (Respingos e Vento)
 */
const splashGeo = new THREE.BufferGeometry();
const splashCount = 100;
const splashPos = new Float32Array(splashCount * 3);
const splashVels = [];
splashGeo.setAttribute('position', new THREE.BufferAttribute(splashPos, 3));
const splashMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
const splashes = new THREE.Points(splashGeo, splashMat);
scene.add(splashes);

/**
 * 4. FÍSICA E ESTADO DO JOGO (Incremental Logic)
 */
let gameState = { currency: 0, state: 'IDLE', aimPulse: 0, aimGrowing: true };
let upgrades = {
    impulse: { level: 0, cost: 10, costMult: 1.5 },
    aerodynamics: { level: 0, cost: 50, costMult: 1.8 },
    wind: { level: 0, cost: 200, costMult: 2.5 }
};

const physics = {
    x: 0, y: 15, z: 0, // Posição
    vx: 0, vy: 0, // Velocidade
    bounces: 0, distance: 0,
    gravity: 0.4,
    waterBounciness: 0.55,
    waterFriction: 0.75, // Velocidade horizontal perdida no impacto
    active: false,
    windActive: false,
    windTimer: 0
};

stoneMesh.position.set(0, 15, 0);

// LOAD/SAVE
function loadData() {
    const saved = localStorage.getItem('skipGoldenSave');
    if (saved) {
        const p = JSON.parse(saved);
        gameState.currency = p.currency || 0;
        if(p.upgrades) upgrades = p.upgrades;
    }
    updateUI();
}
function saveData() { localStorage.setItem('skipGoldenSave', JSON.stringify({ currency: gameState.currency, upgrades })); }
window.buyUpgrade = function(type) {
    let upg = upgrades[type];
    if (gameState.currency >= Math.floor(upg.cost)) {
        gameState.currency -= Math.floor(upg.cost);
        upg.level++;
        upg.cost *= upg.costMult;
        saveData();
        updateUI();
    }
};

function triggerSplash(x, y, z) {
    for (let i = 0; i < splashCount; i++) {
        splashPos[i*3] = x + (Math.random() - 0.5) * 2;
        splashPos[i*3+1] = y;
        splashPos[i*3+2] = z + (Math.random() - 0.5) * 2;
        splashVels[i] = {
            vx: (Math.random() - 0.5) * 2,
            vy: Math.random() * 3 + 1,
            vz: (Math.random() - 0.5) * 2
        };
    }
    splashes.geometry.attributes.position.needsUpdate = true;
}

function launchStone(accuracy) {
    physics.x = 0; physics.y = 10; physics.z = 0;
    // Força máxima se accuracy for 1 (perfeito)
    physics.vx = 0; 
    physics.vz = 15 + (accuracy * 35); // Lançamento em Z positivo (para o horizonte)
    physics.vy = Math.max(-2, -5 + (accuracy * 2)); 
    physics.bounces = 0; physics.distance = 0;
    physics.active = true;
    physics.windActive = false;
}

/**
 * 5. CONTROLES DA INTERFACE
 */
function updateUI() {
    document.getElementById('currency-display').innerText = gameState.currency.toLocaleString();
    document.getElementById('dist-display').innerText = Math.floor(physics.distance);
    document.getElementById('bounce-display').innerText = physics.bounces;

    for (let key in upgrades) {
        let eC = document.getElementById(`cost-${key}`);
        let eL = document.getElementById(`lvl-${key}`);
        if (eC && eL) {
            eC.innerText = `Âmbar: ${Math.floor(upgrades[key].cost).toLocaleString()}`;
            eL.innerText = `Lvl ${upgrades[key].level}`;
        }
    }
}

document.getElementById('shop-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const shop = document.getElementById('shop-menu');
    shop.style.display = shop.style.display === 'flex' ? 'none' : 'flex';
});

const aimRing = document.getElementById('aim-ring');
const aimPulse = document.getElementById('aim-pulse');

window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.glass-panel')) return;

    if (gameState.state === 'IDLE') {
        gameState.state = 'CHARGING';
        gameState.aimPulse = 0;
        aimRing.style.display = 'flex';
    } else if (gameState.state === 'FLYING' && upgrades.impulse.level > 0 && !physics.windActive) {
        // Impulso mid-air (Intervenção manual)
        physics.vy = 4 + (upgrades.impulse.level * 0.5);
        physics.vz += 2 + (upgrades.impulse.level * 0.5);
        triggerSplash(physics.x, physics.y, physics.z); // Efeito no ar
    }
});

window.addEventListener('pointerup', () => {
    if (gameState.state === 'CHARGING') {
        // Pulse vai de 0 a 100. Perfeito é próximo de 100.
        let accuracy = gameState.aimPulse / 100;
        launchStone(accuracy);
        gameState.state = 'FLYING';
        aimRing.style.display = 'none';
        document.getElementById('shop-menu').style.display = 'none';
    }
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/**
 * 6. LOOP PRINCIPAL (Renderização e Física 3D)
 */
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now() * 0.001;

    // Animação da Água
    water.material.uniforms['time'].value += 1.0 / 60.0;

    // Animação do Medidor de Mira
    if (gameState.state === 'CHARGING') {
        if (gameState.aimGrowing) {
            gameState.aimPulse += 2;
            if (gameState.aimPulse >= 100) gameState.aimGrowing = false;
        } else {
            gameState.aimPulse -= 2;
            if (gameState.aimPulse <= 10) gameState.aimGrowing = true;
        }
        aimPulse.style.width = gameState.aimPulse + '%';
        aimPulse.style.height = gameState.aimPulse + '%';
        // Muda de cor quando perfeito (acima de 90%)
        aimPulse.style.background = gameState.aimPulse > 90 ? '#00ffcc' : 'var(--accent)';
    }

    // FÍSICA DA PEDRA
    if (physics.active) {
        // Rotação da pedra
        stoneMesh.rotation.x += physics.vz * 0.05;
        stoneMesh.rotation.z += (Math.random() - 0.5) * 0.1;

        let drag = 0.995 + (upgrades.aerodynamics.level * 0.001);
        if (drag > 0.999) drag = 0.999;

        if (physics.windActive) {
            physics.windTimer--;
            physics.y = 15 + Math.sin(time * 5) * 2; // Flutuação
            physics.vz = 25; // Velocidade de voo do vento
            physics.vy = 0;
            if (physics.windTimer <= 0) physics.windActive = false;
        } else {
            physics.vy -= physics.gravity;
            physics.vz *= drag;
        }

        physics.x += physics.vx;
        physics.y += physics.vy;
        physics.z += physics.vz;
        physics.distance = Math.max(0, physics.z);

        // Colisão com a Água (Y=0)
        if (physics.y <= 0) {
            physics.y = 0;
            if (physics.vz > 5) { // Condição de quique
                physics.vy = Math.abs(physics.vy) * physics.waterBounciness;
                physics.vz *= physics.waterFriction;
                physics.bounces++;
                triggerSplash(physics.x, 0, physics.z);

                // Chance de corrente de vento (Passiva)
                let windChance = Math.min(0.4, upgrades.wind.level * 0.05);
                if (Math.random() < windChance && !physics.windActive) {
                    physics.windActive = true;
                    physics.windTimer = 80; // duração em frames
                }
            } else {
                // Afunda e termina a rodada
                physics.active = false;
                triggerSplash(physics.x, 0, physics.z);
                
                // Calcula Recompensas (Distância + Quiques)
                let earned = Math.floor((physics.distance / 20) * (1 + physics.bounces * 0.2));
                gameState.currency += earned;
                saveData();
                updateUI();
                
                setTimeout(() => { gameState.state = 'IDLE'; }, 2000);
            }
        }
        
        stoneMesh.position.set(physics.x, physics.y, physics.z);
        
        // Câmera persegue a pedra suavemente
        camera.position.z += (physics.z - 50 - camera.position.z) * 0.1;
        camera.position.y += (Math.max(15, physics.y + 10) - camera.position.y) * 0.05;
        camera.lookAt(stoneMesh.position.x, 0, stoneMesh.position.z + 50);
    } else if (gameState.state === 'IDLE') {
        // Câmera volta para a base
        stoneMesh.position.set(0, 10, 0);
        camera.position.z += (-50 - camera.position.z) * 0.05;
        camera.position.y += (30 - camera.position.y) * 0.05;
        camera.lookAt(0, 0, 50);
    }

    // Animação das Partículas (Respingos)
    const pos = splashes.geometry.attributes.position.array;
    for (let i = 0; i < splashCount; i++) {
        if (pos[i*3+1] > -10) { // Se estiver acima do fundo
            pos[i*3] += splashVels[i] ? splashVels[i].vx : 0;
            pos[i*3+1] += splashVels[i] ? splashVels[i].vy : 0;
            pos[i*3+2] += splashVels[i] ? splashVels[i].vz : 0;
            if(splashVels[i]) splashVels[i].vy -= 0.2; // Gravidade da partícula
        }
    }
    splashes.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}

// Remover tela de loading e iniciar
document.getElementById('loading').style.display = 'none';
loadData();
animate();

</script>
</body>
</html>
